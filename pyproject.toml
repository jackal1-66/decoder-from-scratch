[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "decoder-from-scratch"
version = "0.1.0"
description = "A decoder-only transformer written from scratch in PyTorch: attention, RoPE, KV cache, sampling, LoRA."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["torch>=2.4"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "numpy>=2.0"]
# On Linux the `mlx` wheel holds only the Python bindings; the `cpu` extra adds the
# compiled backend (it is a no-op on macOS, where the Metal backend is always installed).
mlx = ["mlx[cpu]>=0.32.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N"]
# N803/N806/N812: tensor-shape names (B, T, H, D) are clearer in capitals.
# RUF001-003: Greek letters (alpha, theta, tau) are deliberate mathematical notation.
ignore = ["N803", "N806", "N812", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests", "scripts"]
# nn.Module.__call__ returns Any and Tensor.backward is untyped in torch's stubs; with
# these two checks on, every forward call and every backward() needs an ignore.
warn_return_any = false
disallow_untyped_calls = false

# mlx.nn re-exports its layers through `import *` from modules without __all__, which
# strict mode's no_implicit_reexport turns into "Module has no attribute Linear".
[[tool.mypy.overrides]]
module = ["mlx.nn", "mlx.nn.layers"]
implicit_reexport = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs a CUDA GPU; skipped in CI"]
